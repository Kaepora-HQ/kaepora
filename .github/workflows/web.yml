name: web

on:
  pull_request:
    paths:
      - web/**
      - FAQ.md
      - RANDOMIZED.md
      - remake/chests.tsv
      - remake/stones.tsv
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - web/**
      - FAQ.md
      - RANDOMIZED.md
      - remake/chests.tsv
      - remake/stones.tsv
      - .github/workflows/web.yml

permissions:
  contents: read

jobs:
  check:
    name: Website type check, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
