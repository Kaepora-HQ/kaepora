name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels a pull request's run; main runs finish so each merge saves its compiler cache.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Ubuntu 24.04's default compilers, GCC 13 and Clang 18, cannot compile #embed. This is the newest Clang that Ubuntu
  # 24.04 packages itself.
  LLVM_VERSION: "20"
  QT_VERSION: "6.8.3"
  # The clang-cl that Lichii's Windows builds use.
  CLANG_CL_VERSION: "22.1.8"

jobs:
  linux:
    name: Linux build, tests and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" ninja-build nlohmann-json3-dev libspdlog-dev libzstd-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          "clang-$LLVM_VERSION" --version

      # Ubuntu's ccache 4.9 does not see the files #embed reads, so an edited remake table would come back as a stale
      # cached object. From 4.14, ccache compiles a file that uses #embed through the preprocessor.
      - name: Install ccache
        run: |
          archive="$RUNNER_TEMP/ccache.tar.xz"
          curl -fsSL -o "$archive" \
            https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-x86_64-glibc.tar.xz
          echo "c94a5688546883eee4c87764b34fa2eb18a4879421a51589c37538aed6312dfc  $archive" | sha256sum -c
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.3-linux-x86_64-glibc" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      # Objects are keyed by content, so the newest cache of this branch or main always helps. Restored and saved
      # separately so a test failure still keeps the compiled objects.
      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: clang${{ env.LLVM_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang${{ env.LLVM_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=clang-$LLVM_VERSION"
          "-DCMAKE_CXX_COMPILER=clang++-$LLVM_VERSION"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      # CMakeLists.txt leaves the window out quietly where it finds no Qt.
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build
          ccache --show-stats
          test -x build/kaepora

      # The tests that read the game file are registered only when KAEPORA_GAME_NUP names it, and it never comes here.
      # The window tests make their certificate with the openssl command.
      - name: Run tests
        run: |
          command -v openssl
          ctest --test-dir build --output-on-failure --no-tests=error --parallel "$(nproc)"

      - name: Make the seeds to compare with Windows
        run: python3 -I tests/same_seeds.py build/kaepora-seedgen seeds

      - name: Upload the seeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeds-linux-${{ github.sha }}
          path: seeds/
          if-no-files-found: error
          retention-days: 7

      - name: Package
        run: tools/package-linux.sh build "kaepora-$GITHUB_SHA-linux-x86_64" "build-$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaepora-linux-x86_64-${{ github.sha }}
          path: |
            kaepora-${{ github.sha }}-linux-x86_64.AppImage
            kaepora-${{ github.sha }}-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}


  windows:
    name: Windows build, tests and package
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # clang-cl compiles against the MSVC headers, libraries and SDK that the previous step puts in INCLUDE and LIB.
      - name: Install LLVM
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'llvm.exe'
          Invoke-WebRequest -OutFile $installer "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:CLANG_CL_VERSION/LLVM-$env:CLANG_CL_VERSION-win64.exe"
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') {
            throw 'LLVM installer checksum mismatch'
          }
          $root = Join-Path $env:RUNNER_TEMP 'llvm'
          Start-Process -Wait -FilePath $installer -ArgumentList '/S', "/D=$root"
          & "$root/bin/clang-cl.exe" --version
          "LLVM_ROOT=$($root.Replace('\', '/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne 'c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd') {
            throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.3-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: clang-cl${{ env.CLANG_CL_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang-cl${{ env.CLANG_CL_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      # The LLVM step pins clang-cl by its sum, so its version names the compiler for ccache, as in Lichii's job.
      - name: Build
        env:
          CCACHE_COMPILERCHECK: string:${{ env.CLANG_CL_VERSION }}
        run: |
          ccache --zero-stats
          cmake --build build 2>&1 | tee build.log
          ccache --show-stats

      - name: Check our files built without warnings
        run: |
          if grep -E '[\\/](generator|kaepora|patcher|tests)[\\/][^\\/:]+\([0-9]+,[0-9]+\): warning' build.log; then
            exit 1
          fi

      # The package carries Qt's Schannel plugin and not its OpenSSL one, which Qt would prefer, so the tests use
      # Schannel too.
      - name: Leave Qt's OpenSSL plugin out of the tests
        run: rm "$QT_ROOT_DIR/plugins/tls/qopensslbackend.dll"

      # The window tests make their certificate with the openssl command.
      - name: Run tests
        run: |
          command -v openssl
          ctest --test-dir build --output-on-failure --no-tests=error --parallel "$NUMBER_OF_PROCESSORS"

      - name: Make the seeds to compare with Linux
        run: python -I tests/same_seeds.py build/kaepora-seedgen.exe seeds

      - name: Upload the seeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeds-windows-${{ github.sha }}
          path: seeds/
          if-no-files-found: error
          retention-days: 7

      - name: Package
        run: tools/package-windows.sh build kaepora-windows-x86_64.zip

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kaepora-windows-x86_64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  windows-package:
    name: Windows package on a fresh runner
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/check-windows-package.ps1
          sparse-checkout-cone-mode: false

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaepora-windows-x86_64.zip
          skip-decompress: true

      - name: Start the window from the unzipped package
        shell: pwsh
        run: tools/check-windows-package.ps1 kaepora-windows-x86_64.zip

  same-seeds:
    name: Same seeds on Linux and Windows
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the seeds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seeds-*-${{ github.sha }}

      - name: Compare
        run: |
          linux=seeds-linux-$GITHUB_SHA
          windows=seeds-windows-$GITHUB_SHA
          count=$(find "$linux" -type f | wc -l)
          test "$count" -gt 0
          if ! diff -rq "$linux" "$windows"; then
            first=$(diff -rq "$linux" "$windows" | sed -n 's/^Files \(.*\) and \(.*\) differ$/\1 \2/p' | head -1)
            [ -n "$first" ] && diff -u $first | head -100
            exit 1
          fi
          echo "Linux and Windows made the same $count files"

