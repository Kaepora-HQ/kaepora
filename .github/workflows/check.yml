name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The release's commit, which can be older than the commit that started the run
        type: string
        required: false
      version:
        description: The release's version, which the AppImage carries in place of the build number
        type: string
        required: false

permissions:
  contents: read

# A newer push cancels a pull request's run; main runs finish so each merge saves its compiler cache. A called workflow
# takes the caller's name in github.workflow, so a release's build and this workflow's own run never share a group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Linux packages are built on this runner, so they run wherever glibc is 2.39 or later, as Lichii's own Linux
  # build does. Ubuntu 26.04 would raise that to 2.43. Ubuntu 24.04's default compilers, GCC 13 and Clang 18, cannot
  # compile #embed, which the generator uses for its tables. This is the newest Clang that Ubuntu 24.04 packages itself.
  LLVM_VERSION: "20"
  QT_VERSION: "6.12.1"
  # The clang-cl that Lichii's Windows builds use.
  CLANG_CL_VERSION: "22.1.8"

jobs:
  linux:
    name: Linux build, tests and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults: &bash
      run:
        shell: bash
    env: &ccache-settings
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - &check-out-source
        name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" ninja-build nlohmann-json3-dev libspdlog-dev libzstd-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          "clang-$LLVM_VERSION" --version

      # Ubuntu's ccache 4.9 does not see the files #embed reads, so an edited remake table would come back as a stale
      # cached object. From 4.14, ccache compiles a file that uses #embed through the preprocessor.
      - &linux-install-ccache
        name: Install ccache
        run: |
          archive="$RUNNER_TEMP/ccache.tar.xz"
          curl -fsSL -o "$archive" \
            https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-linux-x86_64-glibc.tar.xz
          echo "c94a5688546883eee4c87764b34fa2eb18a4879421a51589c37538aed6312dfc  $archive" | sha256sum -c
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.3-linux-x86_64-glibc" >> "$GITHUB_PATH"

      # The Qt action installs its tools with pip on every run. Three packages they need have no built wheels for
      # Python 3.15, so pip compiles them. pip's cache keeps what it compiled for the next run.
      - &python-with-pips-cache
        name: Set up Python with pip's cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          # The action wants a file to key the cache by. This one names the Qt action, which decides what pip installs.
          cache-dependency-path: .github/workflows/check.yml

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
          setup-python: false

      # Objects are keyed by content, so the newest cache of this branch or main always helps. Restored and saved
      # separately so a test failure still keeps the compiled objects.
      - &linux-restore-compiler-objects
        name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: clang${{ env.LLVM_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang${{ env.LLVM_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-

      - &linux-configure
        name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=clang-$LLVM_VERSION"
          "-DCMAKE_CXX_COMPILER=clang++-$LLVM_VERSION"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      # CMakeLists.txt leaves the window out quietly where it finds no Qt.
      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build
          ccache --show-stats
          test -x build/kaepora

      # The tests that read the game file are registered only when KAEPORA_GAME_NUP names it, and it never comes here.
      # The window tests make their certificate with the openssl command.
      - name: Run tests
        run: |
          command -v openssl
          ctest --test-dir build --output-on-failure --no-tests=error --parallel "$(nproc)"

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          tools/package-linux.sh build "kaepora-$GITHUB_SHA-linux-x86_64"
          "${VERSION:-build-$GITHUB_RUN_NUMBER-${GITHUB_SHA::7}}"

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaepora-linux-x86_64-${{ github.sha }}
          path: |
            kaepora-${{ github.sha }}-linux-x86_64.AppImage
            kaepora-${{ github.sha }}-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  # A seed job restores its build job's caches under the same keys and never saves them. A cache key is saved only once,
  # so the build job, which compiles every target, is the one writer.
  linux-seeds:
    name: Linux seeds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: *bash
    env: *ccache-settings
    steps:
      - *check-out-source

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_VERSION" ninja-build nlohmann-json3-dev libspdlog-dev libzstd-dev
          "clang-$LLVM_VERSION" --version

      - *linux-install-ccache
      - *linux-restore-compiler-objects
      - *linux-configure

      - name: Build the seed generator
        run: |
          ccache --zero-stats
          cmake --build build --target kaepora-seedgen
          ccache --show-stats

      - name: Make the seeds to compare with Windows
        run: python3 -I tests/same_seeds.py build/kaepora-seedgen seeds

      - name: Upload the seeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeds-linux-${{ github.sha }}
          path: seeds/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows build, tests and package
    runs-on: windows-2022
    timeout-minutes: 90
    defaults: *bash
    env: &windows-ccache-settings
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    steps:
      - *check-out-source

      # clang-cl reads the MSVC and Windows SDK headers from INCLUDE, and lld-link reads their libraries from LIB. This
      # step sets both.
      - &windows-set-up-msvc
        name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - &windows-restore-llvm
        name: Restore LLVM
        id: llvm
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm
          key: LLVM-${{ env.CLANG_CL_VERSION }}-win64

      - &windows-install-llvm
        name: Install LLVM
        shell: pwsh
        env:
          LLVM_RESTORED: ${{ steps.llvm.outputs.cache-hit }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'llvm'
          if ($env:LLVM_RESTORED -ne 'true') {
            $installer = Join-Path $env:RUNNER_TEMP 'llvm.exe'
            Invoke-WebRequest -OutFile $installer "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:CLANG_CL_VERSION/LLVM-$env:CLANG_CL_VERSION-win64.exe"
            if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') {
              throw 'LLVM installer checksum mismatch'
            }
            Start-Process -Wait -FilePath $installer -ArgumentList '/S', "/D=$root"
          }
          & "$root/bin/clang-cl.exe" --version
          "LLVM_ROOT=$($root.Replace('\', '/'))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Save LLVM
        if: steps.llvm.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/llvm
          key: ${{ steps.llvm.outputs.cache-primary-key }}

      - *python-with-pips-cache

      # Qt keeps its Windows binaries from 6.11 on in a folder per compiler, which aqtinstall 3.3.0, its newest release,
      # cannot find. This commit of its master finds them.
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          setup-python: false
          aqtsource: aqtinstall @ git+https://github.com/miurahr/aqtinstall@4c759852b1108cc801d8e24979136b895b5155d4

      - &windows-install-ccache
        name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne 'c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd') {
            throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.3-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Inno Setup
        shell: pwsh
        run: tools/install-inno-setup.ps1

      - &windows-restore-compiler-objects
        name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: clang-cl${{ env.CLANG_CL_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang-cl${{ env.CLANG_CL_VERSION }}-qt${{ env.QT_VERSION }}-${{ runner.os }}-

      - &windows-configure
        name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      # The LLVM step pins clang-cl by its sum, so its version names the compiler for ccache, as in Lichii's job.
      - name: Build
        env:
          CCACHE_COMPILERCHECK: string:${{ env.CLANG_CL_VERSION }}
        run: |
          ccache --zero-stats
          cmake --build build 2>&1 | tee build.log
          ccache --show-stats

      - name: Check our files built without warnings
        run: |
          if grep -E '[\\/](generator|kaepora|patcher|tests)[\\/][^\\/:]+\([0-9]+,[0-9]+\): warning' build.log; then
            exit 1
          fi

      # Antivirus heuristics count a program without a version resource against it.
      - name: Check the window carries its icon and version
        shell: pwsh
        run: |
          $resources = & "$env:LLVM_ROOT/bin/llvm-readobj.exe" --coff-resources build/kaepora.exe
          foreach ($line in 'Type: GROUP_ICON', 'Name: IDI_ICON1', 'Type: VERSIONINFO') {
            if (-not ($resources -match [regex]::Escape($line))) {
              throw "kaepora.exe has no resource with $line"
            }
          }
          $header = Select-String -Path build/include/version.h -Pattern 'KAEPORA_VERSION "(.*)"'
          $expected = $header.Matches[0].Groups[1].Value
          $info = (Get-Item build/kaepora.exe).VersionInfo
          if ($info.FileVersion -ne $expected -or $info.ProductVersion -ne $expected) {
            throw "kaepora.exe says version $($info.ProductVersion), not $expected"
          }
          "kaepora.exe carries its icon and version $expected"

      # The package carries Qt's Schannel plugin and not its OpenSSL one, which Qt would prefer, so the tests use
      # Schannel too.
      - name: Leave Qt's OpenSSL plugin out of the tests
        run: rm "$QT_ROOT_DIR/plugins/tls/qopensslbackend.dll"

      # The window tests make their certificate with the openssl command.
      - name: Run tests
        run: |
          command -v openssl
          ctest --test-dir build --output-on-failure --no-tests=error --parallel "$NUMBER_OF_PROCESSORS"

      - name: Package
        run: tools/package-windows.sh build kaepora-windows-x86_64.zip kaepora-windows-x86_64-setup.exe

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kaepora-windows-x86_64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kaepora-windows-x86_64-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  windows-seeds:
    name: Windows seeds, part ${{ matrix.part }} of 2
    strategy:
      matrix:
        part: [1, 2]
    runs-on: windows-2022
    timeout-minutes: 45
    defaults: *bash
    env: *windows-ccache-settings
    steps:
      - *check-out-source
      - *windows-set-up-msvc
      - *windows-restore-llvm
      - *windows-install-llvm
      - *windows-install-ccache
      - *windows-restore-compiler-objects
      - *windows-configure

      - name: Build the seed generator
        env:
          CCACHE_COMPILERCHECK: string:${{ env.CLANG_CL_VERSION }}
        run: |
          ccache --zero-stats
          cmake --build build --target kaepora-seedgen
          ccache --show-stats

      - name: Make the seeds to compare with Linux
        run: python -I tests/same_seeds.py build/kaepora-seedgen.exe seeds "${{ matrix.part }}/2"

      - name: Upload the seeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeds-windows-${{ github.sha }}-${{ matrix.part }}
          path: seeds/
          if-no-files-found: error
          retention-days: 7

  windows-package:
    name: Windows package on a fresh runner
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/check-windows-package.ps1
          sparse-checkout-cone-mode: false

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaepora-windows-x86_64.zip
          skip-decompress: true

      - name: Start the window from the unzipped package
        shell: pwsh
        run: |
          Expand-Archive kaepora-windows-x86_64.zip -DestinationPath kaepora
          tools/check-windows-package.ps1 kaepora

  # A runner of its own, so the installer meets a machine where Kaepora has never run, as a new player's is.
  windows-installer:
    name: Windows installer on a fresh runner
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out the check scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            tools/check-windows-installer.ps1
            tools/check-windows-package.ps1
          sparse-checkout-cone-mode: false

      - name: Download the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaepora-windows-x86_64-setup.exe

      - name: Install, start and uninstall Kaepora
        shell: pwsh
        run: tools/check-windows-installer.ps1 kaepora-windows-x86_64-setup.exe

  macos:
    name: macOS build, tests and package
    runs-on: macos-15
    timeout-minutes: 60
    defaults: *bash
    env: *ccache-settings
    steps:
      - *check-out-source

      - &macos-show-the-compiler
        name: Show the compiler
        run: |
          xcode-select -p
          clang --version

      - &macos-install-ccache
        name: Install ccache
        run: |
          archive="$RUNNER_TEMP/ccache.tar.gz"
          curl -fsSL -o "$archive" \
            https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-darwin.tar.gz
          echo "764dd2a8100ff83e6bbd7b9a1e2016cc401be34bee8a70ea99698186622c34d5  $archive" | shasum -a 256 -c
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ccache-4.14.3-darwin" >> "$GITHUB_PATH"

      - *python-with-pips-cache

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
          setup-python: false

      - &macos-restore-compiler-objects
        name: Restore compiler objects
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: appleclang-qt${{ env.QT_VERSION }}-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            appleclang-qt${{ env.QT_VERSION }}-${{ runner.os }}-

      - &macos-configure
        name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"

      - name: Build
        run: |
          ccache --zero-stats
          cmake --build build 2>&1 | tee build.log
          ccache --show-stats

      - name: Check our files built without warnings
        run: |
          if grep -E '/(generator|kaepora|patcher|tests)/[^/:]+:[0-9]+:[0-9]+: warning' build.log; then
            exit 1
          fi

      # Qt prefers its OpenSSL plugin to Secure Transport. Without it in Qt's folder, the tests use Secure Transport, and
      # macdeployqt leaves it out of the package.
      - name: Leave Qt's OpenSSL plugin out of the tests and the package
        run: rm "$QT_ROOT_DIR/plugins/tls/libqopensslbackend.dylib"

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$(sysctl -n hw.ncpu)"

      - name: Package
        run: tools/package-macos.sh build kaepora-macos-arm64.zip

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: kaepora-macos-arm64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Save compiler objects
        if: always() && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  macos-seeds:
    name: macOS seeds
    runs-on: macos-15
    timeout-minutes: 30
    defaults: *bash
    env: *ccache-settings
    steps:
      - *check-out-source
      - *macos-show-the-compiler
      - *macos-install-ccache
      - *macos-restore-compiler-objects
      - *macos-configure

      - name: Build the seed generator
        run: |
          ccache --zero-stats
          cmake --build build --target kaepora-seedgen
          ccache --show-stats

      - name: Make the seeds to compare with Linux
        run: python3 -I tests/same_seeds.py build/kaepora-seedgen seeds

      - name: Upload the seeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: seeds-macos-${{ github.sha }}
          path: seeds/
          if-no-files-found: error
          retention-days: 7

  macos-package:
    name: macOS package on a fresh runner
    needs: macos
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out the check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/check-macos-package.sh
          sparse-checkout-cone-mode: false

      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kaepora-macos-arm64.zip
          skip-decompress: true

      - name: Start the window from the unzipped package
        run: tools/check-macos-package.sh kaepora-macos-arm64.zip

  same-seeds:
    name: Same seeds on Linux, Windows and macOS
    needs: [linux-seeds, windows-seeds, macos-seeds]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the Linux and macOS seeds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seeds-{linux,macos}-${{ github.sha }}

      - name: Download both parts of the Windows seeds into one folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: seeds-windows-${{ github.sha }}-*
          path: seeds-windows-${{ github.sha }}
          merge-multiple: true

      - name: Compare
        run: |
          linux=seeds-linux-$GITHUB_SHA
          count=$(find "$linux" -type f | wc -l)
          test "$count" -gt 0
          for system in windows macos; do
            other=seeds-$system-$GITHUB_SHA
            if ! diff -rq "$linux" "$other"; then
              first=$(diff -rq "$linux" "$other" | sed -n 's/^Files \(.*\) and \(.*\) differ$/\1 \2/p' | head -1)
              [ -n "$first" ] && diff -u $first | head -100
              exit 1
            fi
            echo "Linux and $system made the same $count files"
          done

