name: game-testing

on:
  pull_request:
    paths:
      - tools/game-testing/**
      - .github/workflows/game-testing.yml
  push:
    branches: [main]
    paths:
      - tools/game-testing/**
      - .github/workflows/game-testing.yml

permissions:
  contents: read

jobs:
  check:
    name: Game testing type check, lint and tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/game-testing
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tools/game-testing/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run check

      - name: Test
        run: bun run test
