; The settings every place starts from, written whole before each start, since Lichii writes its settings back when it
; stops. Lichii takes a value only when its \default line says false. No folder is named: Lichii's own folders fall
; under the place, through the XDG folders the image sets.

[Audio]
; None. A container has no sound device, and with automatic output Lichii stops within a minute.
output_engine\default=false
output_engine=3

[UI]
; Never ask, so a stop's SIGTERM closes Lichii.
confirmStop\default=false
confirmStop=2
; Nobody can answer a question on a place's display.
gui_hide_backend_warning\default=false
gui_hide_backend_warning=true
check_for_updates\default=false
check_for_updates=false

[Renderer]
; What Lichii writes when it starts with no settings file: FSR 3, low GPU accuracy, video decoded on the GPU, and
; presentation off the render thread.
scaling_filter\default=false
scaling_filter=15
gpu_accuracy\default=false
gpu_accuracy=0
nvdec_emulation\default=false
nvdec_emulation=2
async_presentation\default=false
async_presentation=true
